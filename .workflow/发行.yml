version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
stages:
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    # Tag 推送时 GITEE_COMMIT_MESSAGE 取的是触发提交的提交信息（已验证，标签说明不生效）
    # 约定：发版提交的提交信息只写版本号，如 "V1.3"
    releaseName: "${GITEE_COMMIT_MESSAGE}"
    description: CHANGELOG.md
    tagName: "${GITEE_COMMIT_MESSAGE}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    tags:
      prefix:
        - release-
notify: []
