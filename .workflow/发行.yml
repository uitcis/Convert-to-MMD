version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
stages:
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    # 判别实验：用 DBG 前缀 + GITEE_COMMIT_MESSAGE 生成临时标签，产物可用 git ls-remote 观察
    releaseName: "DBG-${GITEE_COMMIT_MESSAGE}"
    description: CHANGELOG.md
    tagName: "DBG-${GITEE_COMMIT_MESSAGE}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    tags:
      prefix:
        - release-
notify: []
