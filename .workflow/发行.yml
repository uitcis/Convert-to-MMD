version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
variables:
  # 占位值，实际由「解析版本号」阶段写入 GITEE_PARAMS 覆盖（跨阶段生效）
  RELEASE_TAG: "V1.0.0"
stages:
- name: 解析版本
  displayName: 解析版本
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: parse_release_tag
    displayName: 解析 release- 标签
    nodeVersion: 14.16.0
    commands: |
      # 标签名不在 Gitee Go 系统变量中，用工作区仓库反查触发标签
      TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^release-' | sort -V | tail -n1)
      if [ -z "$TAG" ]; then
        git fetch --tags --quiet >/dev/null 2>&1 || true
        TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^release-' | sort -V | tail -n1)
      fi
      # 兜底：部分场景下工作区没有标签，Tag 触发的提交信息即标签说明
      if [ -z "$TAG" ]; then TAG="$GITEE_COMMIT_MESSAGE"; fi
      VERSION=$(printf '%s' "$TAG" | grep -oE '[0-9]+(\.[0-9]+)+' | head -n1)
      if [ -z "$VERSION" ]; then
        echo "无法解析版本号（触发标识：${TAG}），终止发版"
        exit 1
      fi
      RELEASE_TAG="V${VERSION}"
      echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITEE_PARAMS"
      echo "触发标识：${TAG}，发布标签：${RELEASE_TAG}"
      cat "$GITEE_PARAMS"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    releaseName: "${RELEASE_TAG}"
    description: CHANGELOG.md
    tagName: "${RELEASE_TAG}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    tags:
      prefix:
        - release-
notify: []
