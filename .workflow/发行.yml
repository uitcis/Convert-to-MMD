name: Tag自动发版
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v3

      - name: 执行编译打包
        run: |
          echo "开始构建"
          mkdir output
          zip -r output/firmware.zip ./bin

      - name: 发布版本
        uses: publish@release
        with:
          files: output/firmware.zip
