version: '1.0'
name: tag-auto-release
displayName: Tag自动发版
triggers:
  push:
    - matchType: REGEX
      branch: ''
      tag: '^v.*'
stages:
  - name: build-stage
    displayName: 编译打包
    strategy: naturally
    trigger: auto
    steps:
      - step: checkout@v1
        name: checkout
        displayName: 检出源码
      - step: shell@v1
        name: build
        displayName: 执行构建
        inputs:
          commands: |
            mkdir -p output
            zip -r output/firmware.zip ./bin
      - step: publish@release
        name: create_release
        displayName: 创建版本发布
        inputs:
          files: output/firmware.zip
