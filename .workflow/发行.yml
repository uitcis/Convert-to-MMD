# ============================================================
# 发版流程（必须两次提交，否则发行失败）
#   1) 提交更新：代码 / 功能 / CHANGELOG 内容变更，提交说明正常写。
#   2) 提交发行触发：单独一次提交，提交说明只有纯版本号（如 V1.5），
#      且本次提交必须改 CHANGELOG.md，用于打 tag 并触发本流水线。
# 原因：下方 releaseName / tagName 直接取 GITEE_COMMIT_MESSAGE 当 tag 名，
#       提交说明带任何描述文字（含空格）都会生成非法 tag 导致发行失败。
# CHANGELOG 约定：每次发版只保留当前版本条目，旧条目不要堆叠。
# 版本号：__init__.py 的 bl_info.version 长期为 (2, 6)，与 CHANGELOG
#         的 1.x 发版标签是两套编号，不要擅自同步。
# ============================================================
version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
stages:
- name: 检测变更
  displayName: 检测 CHANGELOG 变更
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: check_changelog
    displayName: 校验 CHANGELOG.md 变更与版本号一致性
    nodeVersion: 14.16.0
    commands: |
      cd "$(git rev-parse --show-toplevel 2>/dev/null || pwd)" || true
      echo "工作目录: $(pwd)"
      MSG="$GITEE_COMMIT_MESSAGE"
      echo "GITEE_COMMIT_MESSAGE=[$MSG]"

      # 1) 本次提交必须改了 CHANGELOG.md
      FILES=$(git show --pretty=format: --name-only HEAD 2>/dev/null || true)
      echo "本次提交变更文件:"
      echo "$FILES"
      if ! printf '%s\n' "$FILES" | grep -qx 'CHANGELOG.md'; then
        echo "本次提交未修改 CHANGELOG.md，终止（下游发布阶段不会执行）"
        exit 1
      fi
      echo "检测到 CHANGELOG.md 变更"

      # 2) 从 CHANGELOG.md 版本条目解析版本号（权威来源）
      #    形如 "## [1.4] - 2026-11-26"
      LINE=$(grep -m1 -E '^## +\[?[0-9]+\.[0-9]+' CHANGELOG.md 2>/dev/null || true)
      echo "CHANGELOG 版本条目: [$LINE]"
      MD_VER=$(printf '%s' "$LINE" | sed -n 's/^## *\[*\([0-9][0-9.]*\).*/\1/p' || true)
      if [ -z "$MD_VER" ]; then
        echo "无法从 CHANGELOG.md 解析版本号，终止发版"
        exit 1
      fi
      echo "CHANGELOG.md 版本号: $MD_VER"

      # 3) 提交说明必须是纯版本号（如 V1.5），且与 CHANGELOG 一致
      #    发布阶段的 releaseName/tagName 是渲染期字段，只能取系统变量
      #    GITEE_COMMIT_MESSAGE，因此它会被整体当作 tag 名；说明里带描述
      #    文字（含空格）会产生非法 tag。此处解析出版本号与 CHANGELOG.md
      #    校验一致，防止两者脱节。
      MSG_VER=$(printf '%s' "$MSG" | grep -oE '[0-9]+(\.[0-9]+)+' 2>/dev/null | head -n1 || true)
      if [ -z "$MSG_VER" ]; then
        echo "提交说明必须包含版本号（如 V1.4），当前为: [$MSG]"
        exit 1
      fi
      if [ "$MSG_VER" != "$MD_VER" ]; then
        echo "版本号不一致：提交说明为 $MSG_VER，CHANGELOG.md 为 $MD_VER，终止发版"
        exit 1
      fi
      echo "版本号一致: $MD_VER（发布阶段将以 GITEE_COMMIT_MESSAGE 作为 Release 名与标签）"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    # 说明：releaseName / tagName 是流水线渲染期固化的字段，无法用运行时
    # 解析出的变量注入（${} 会在渲染期被 variables 占位值替换）。
    # 因此这里取系统变量 GITEE_COMMIT_MESSAGE —— 其值即触发提交的提交信息，
    # 由「检测变更」阶段校验它与 CHANGELOG.md 的版本号一致后才放行。
    releaseName: "${GITEE_COMMIT_MESSAGE}"
    description: CHANGELOG.md
    tagName: "${GITEE_COMMIT_MESSAGE}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    branches:
      precise:
        - main
notify: []
