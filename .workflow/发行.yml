version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
variables:
  # 发版时由 AI 更新，必须与 release-x.y 触发标签的版本号一致（流水线会校验）
  RELEASE_TAG: "V1.3"
stages:
- name: 编译打包
  displayName: 编译打包
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: check_release_tag
    displayName: 校验版本号
    nodeVersion: 14.16.0
    commands: |
      # 标签名不在 Gitee Go 系统变量中，用 git 反查触发标签
      TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^release-' | sort -V | tail -n1)
      if [ -z "$TAG" ]; then
        git fetch --tags --quiet >/dev/null 2>&1 || true
        TAG=$(git tag --points-at HEAD 2>/dev/null | grep '^release-' | sort -V | tail -n1)
      fi
      if [ -z "$TAG" ]; then
        echo "未找到 release- 开头的触发标签，终止发版"
        exit 1
      fi
      EXPECTED="V$(printf '%s' "$TAG" | sed 's/^release-//')"
      if [ "$EXPECTED" != "$RELEASE_TAG" ]; then
        echo "触发标签 ${TAG} 与 yml 中的 RELEASE_TAG=${RELEASE_TAG} 不一致，请先更新 .workflow/发行.yml"
        exit 1
      fi
      echo "版本校验通过：${RELEASE_TAG}"
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    releaseName: "${RELEASE_TAG}"
    description: CHANGELOG.md
    tagName: "${RELEASE_TAG}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    tags:
      prefix:
        - release-
notify: []
