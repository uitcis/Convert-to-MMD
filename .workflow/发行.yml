version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
stages:
- name: 编译打包
  displayName: 编译打包
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    releaseName: "release-${CI_COMMIT_TAG}"
    description: CHANGELOG.md
    tagName: "${CI_COMMIT_TAG}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  push:
    tags:
      prefix:
        - V
notify: []
