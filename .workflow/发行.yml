version: '1.0'
name: tag-auto-release
displayName: Tag自动发版
triggers:
  push:
    - matchType: REGEX
      branch: ''
      tag: '^v.*'
stages:
  - name: build-stage
    displayName: 编译打包
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@v1
        name: build
        displayName: 执行构建打包
        inputs:
          commands: |
            mkdir -p output
            zip -r output/firmware.zip ./bin
        artifacts:
          - name: BUILD_OUTPUT
            path: output/firmware.zip

      - step: publish@release
        name: create_release
        displayName: 创建Release发布
        inputs:
          files: output/firmware.zip
        dependArtifact: BUILD_OUTPUT
