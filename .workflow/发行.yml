version: "1.0"
name: tag-auto-release
displayName: Tag自动发版
stages:
- name: 编译打包
  displayName: 编译打包
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: d49d02b4
    displayName: Gitee Release
    releaseName: "release-v.${GITEE_PIPELINE_BUILD_NUMBER}"
    description: CHANGELOG.md
    tagName: "v.${GITEE_PIPELINE_BUILD_NUMBER}"
    upstreamArtifact: []
    assertFiles: []
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  trigger: manual
notify: []
